name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode clean verify

  gpg-signing:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    env:
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Import GPG key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign artifacts
        run: mvn --batch-mode clean verify -Pgpg-signing

      - name: Determine project version
        run: |
          VERSION=$(mvn --batch-mode help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "PROJECT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify signatures
        run: |
          for artifact in \
            "micro-env/target/micro-env-${PROJECT_VERSION}.jar" \
            "micro-env/target/micro-env-${PROJECT_VERSION}-sources.jar" \
            "micro-env/target/micro-env-${PROJECT_VERSION}-javadoc.jar" \
            "micro-env/target/micro-env-${PROJECT_VERSION}.pom"
          do
            gpg --verify "${artifact}.asc" "$artifact"
          done
